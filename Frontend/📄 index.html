<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Gen 5 - Base de Datos MySQL</title>
    
    <!-- Vinculación de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Vinculación de hoja de estilos personalizada -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado semántico -->
    <header class="bg-danger text-white text-center py-4 border-bottom border-dark border-5 shadow">
        <div class="container">
            <h1 class="fw-bold mb-1">Pokédex Región Teselia (Gen 5)</h1>
            <p class="mb-0 text-warning">Consulta en tiempo real a Base de Datos MySQL</p>
        </div>
    </header>

    <!-- Contenido principal semántico -->
    <main class="container my-5 flex-grow-1">
        <section class="caja-custom">
            <div class="row align-items-center mb-4">
                <div class="col-md-6">
                    <h2 class="h4 fw-bold mb-2 mb-md-0">Registros en Base de Datos</h2>
                </div>
                <div class="col-md-6">
                    <!-- Input para el Filtro DOM dinámico -->
                    <input 
                        type="text" 
                        id="inputFiltro" 
                        class="form-control form-control-lg border-warning shadow-sm" 
                        placeholder="🔍 Filtrar por nombre, tipo, habilidad o categoría..." 
                        onkeyup="filtrarDOM()">
                </div>
            </div>

            <!-- Contenedor de grillas Bootstrap donde JS inyectará las tarjetas -->
            <div id="contenedorResultados" class="row g-4">
                <div class="col-12 text-center py-5">
                    <p class="text-muted">Conectando con la API local...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Pie de página semántico -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">Proyecto Web con Acceso a Base de Datos MySQL - PUCV</p>
    </footer>

    <!-- Vinculación del archivo JavaScript -->
    <script src="assets/js/script.js"></script>
</body>
</html>
